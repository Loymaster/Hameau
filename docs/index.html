*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#1a140e;overflow:hidden;font-family:Barlow,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2.5px solid var(--gold);outline-offset:3px;border-radius:4px}
#app{position:relative;width:100%;max-width:480px;height:100vh;height:100dvh;margin:0 auto;overflow:hidden;background:#2a3320;color:var(--ink)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
[hidden]{display:none!important}
svg.i{width:18px;height:18px;flex:none;display:block}
.hand{font-family:var(--hand);font-size:calc(1em*var(--hs))}
/* un lien de texte, sans cadre : le geste principal du jeu */
.tlink{font-family:var(--title);font-style:italic;font-weight:600;font-size:24px;line-height:1.1;color:var(--accent);padding:10px 6px;min-height:44px;position:relative;transition:transform .12s,opacity .2s}
.tlink:after{content:"";position:absolute;left:6px;right:6px;bottom:7px;height:1.5px;background:currentColor;opacity:.45;transform-origin:left;transition:transform .25s}
.tlink:hover:after{transform:scaleX(1.06)}
.tlink:active{transform:translateY(1px)}
.tlink.quiet{font-size:18px;color:var(--sec);font-weight:500}.tlink.quiet:after{opacity:.25}

/* ---------- en jeu : rien n'est encadré, tout est posé sur l'image ---------- */
.hud{position:absolute;left:0;right:0;top:0;padding:calc(6px + env(safe-area-inset-top)) 12px 26px;background:linear-gradient(rgba(22,12,5,.66),rgba(22,12,5,.3) 62%,rgba(22,12,5,0));display:flex;flex-direction:column;gap:6px;z-index:5;pointer-events:none;color:var(--light);text-shadow:0 1px 3px rgba(0,0,0,.75)}
.hud>*{pointer-events:auto}
.hud-top{display:flex;justify-content:space-between;align-items:center}
.hbtn{width:44px;height:44px;margin-left:-9px;display:grid;place-items:center;color:var(--light);filter:drop-shadow(0 1px 2px rgba(0,0,0,.7))}
.hbtn svg{width:24px;height:24px}
.res{display:flex;gap:15px;align-items:center}
.res.four{gap:11px}.res.four .r b{font-size:20px}.res.four .r svg.i{width:18px;height:18px}
.res .r{display:flex;align-items:center;gap:5px;line-height:1;transition:color .25s}
.res .r svg.i{width:20px;height:20px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
.res .r b{font-weight:600;font-size:22px;font-variant-numeric:tabular-nums}

.bottom{position:absolute;left:0;right:0;bottom:0;z-index:5;padding:34px 14px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(rgba(22,12,5,0),rgba(22,12,5,.52) 36%,rgba(22,12,5,.8));pointer-events:none;display:flex;flex-direction:column;gap:6px;color:var(--light);text-shadow:0 1px 3px rgba(0,0,0,.75)}

.mfoot{display:flex;gap:8px;align-items:center;justify-content:space-between;min-height:48px}

.daybar{display:flex;flex-direction:column;gap:7px}
.dayline{display:flex;align-items:center;gap:10px}

/* ---------- écran titre ---------- */
.screen{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column}
.title{align-items:center;justify-content:space-between;padding:calc(84px + env(safe-area-inset-top)) 24px calc(22px + env(safe-area-inset-bottom));background:linear-gradient(rgba(30,16,6,.7),rgba(30,16,6,.08) 38%,rgba(30,16,6,0) 56%,rgba(30,16,6,.7));color:var(--light);text-shadow:0 2px 16px rgba(0,0,0,.6);transition:opacity .9s}

.drop i{position:absolute;left:var(--x);top:var(--y);width:26px;height:12px;margin:-6px 0 0 -13px;border-radius:50%;border:1.5px solid rgba(234,244,246,.9);opacity:0;animation:ring 2s cubic-bezier(.2,.6,.3,1) .42s forwards}

/* ---------- le livre ---------- */
.book{background:var(--dim);padding:calc(22px + env(safe-area-inset-top)) 16px calc(22px + env(safe-area-inset-bottom));perspective:1500px;animation:fadein .7s}

.pfoot{margin-top:auto;text-align:center;font-family:var(--title);font-style:italic;color:var(--sec);font-size:15px;position:absolute!important;left:0;right:0;bottom:14px}

.deck{display:flex;gap:10px;flex-wrap:wrap}
.deck{gap:10px 6px}
.dk{display:flex;flex-direction:column;align-items:center;gap:3px;font-family:var(--title);font-weight:600;font-size:15px;line-height:1;width:calc(25% - 5px);text-align:center}

input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0}

/* ---------- feuilles : soir, fin, carnet du défi ---------- */
.backdrop{position:absolute;inset:0;z-index:30;background:var(--dim);display:flex;flex-direction:column;justify-content:flex-end}

/* ---------- l'ouverture du livre ---------- */
.book.opening{pointer-events:none;perspective:1300px}
.book.opening .page{animation:bookin .95s cubic-bezier(.2,.8,.2,1) backwards}
.cover{z-index:6;transform-origin:left center;backface-visibility:hidden;background:linear-gradient(125deg,#41523A 0%,#2E3B29 55%,#222C1E 100%);color:#EAE7D3;align-items:center;justify-content:center;gap:10px;padding:0;
  box-shadow:0 18px 50px rgba(0,0,0,.62),inset 14px 0 20px -12px rgba(0,0,0,.65),inset 0 0 0 1px rgba(255,255,255,.07);animation:bookin .95s cubic-bezier(.2,.8,.2,1) backwards}

.glow{position:absolute;left:16px;right:16px;top:calc(22px + env(safe-area-inset-top));bottom:calc(22px + env(safe-area-inset-bottom));z-index:4;pointer-events:none;border-radius:5px 12px 12px 5px;
  background:radial-gradient(ellipse 120% 85% at 0% 50%,rgba(255,232,170,.95),rgba(255,226,160,.5) 34%,rgba(255,226,160,0) 72%);mix-blend-mode:screen;opacity:0;animation:glow 2.5s ease-out 1s forwards}
.motes{position:absolute;left:22px;top:calc(22px + env(safe-area-inset-top));bottom:calc(22px + env(safe-area-inset-bottom));width:0;z-index:7;pointer-events:none}

/* ---------- 0.17 ---------- */

.evbox .evj{font-family:Barlow,sans-serif;font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--sec)}
.evd{display:flex;gap:12px;align-items:flex-start;text-align:left}
.evd b{font-family:var(--title);font-weight:600;font-size:21px;line-height:1.1}
.evd small{font-family:Barlow,sans-serif;font-size:13px;color:var(--accent);margin-left:8px;font-weight:600}

.evd.lock{opacity:.5;align-items:center}.evd.lock .evc{border-style:dashed;border-color:var(--line);font-family:var(--title);font-size:20px;color:var(--sec)}
.evbox.reg{background:none;padding:0;gap:16px}
.sheet .evbox{background:none;padding:0}
.evb{width:auto;height:auto;display:flex;align-items:center;gap:8px;background:none;box-shadow:none;border-radius:0;min-width:0;flex:0 1 auto;color:inherit}
.evb .evc{width:34px;height:34px;border:0;background:rgba(251,243,226,.92);box-shadow:0 1px 5px rgba(0,0,0,.4)}
.evb .pile .evc+.evc{margin-left:-8px}
.evb .evnm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:Barlow,sans-serif;font-style:normal;font-weight:600;font-size:15px;opacity:1;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.dayline .evnm{display:none}
.dk.lock{opacity:.6;font-family:Barlow,sans-serif;font-weight:500;font-size:12px;color:var(--sec)}.dk .q{width:100%;height:54px;border-radius:7px;border:1.5px dashed var(--line);display:grid;place-items:center;font-family:var(--title);font-size:26px;color:var(--sec)}
/* un enfant : un portrait plus petit */
.vb.kid canvas{transform:scale(.78);transform-origin:50% 100%}
/* les pastilles empilées restent dans leur page : elles ne passent plus au travers de la feuille qui tourne */
.page{isolation:isolate}
.pgn{display:block;margin-top:6px}
/* la suite des niveaux : un lien en haut de page, à droite du titre */
.tlink.more{position:absolute;right:24px;top:92px;font-size:19px;min-height:40px;padding:4px 2px}
#spn{margin-left:4px;color:rgba(251,243,226,.82)}#spn svg{width:22px;height:22px;stroke-width:1.9}
.speed button{min-width:38px}

.card .ce b.sw svg.i{width:15px;height:15px;vertical-align:-3px}

.delta{flex-wrap:wrap}

.two{align-self:flex-start;display:flex;align-items:center;gap:7px;margin:0 2px;padding:3px 11px 3px 8px;border-radius:999px;border:1.5px solid rgba(255,224,138,.65);background:rgba(255,224,138,.14);color:#FFE9A8;font-weight:600;font-size:15px;line-height:1.2;pointer-events:none}

    /* le son ne peut démarrer qu'après un premier geste ; ensuite, chaque bouton a son petit bruit */
    ['pointerdown', 'pointerup', 'click', 'keydown'].forEach(ev => document.addEventListener(ev, () => SFX.unlock(), true));
    app.addEventListener('click', e => { const b = e.target.closest && e.target.closest('button'); if (b && !b.dataset.snd && !b.dataset.go && !b.dataset.level && !b.dataset.ch && !b.dataset.back) SFX.play('tap'); });
    /* zoom : molette à la souris, deux doigts au téléphone ; une fois zoomé, on fait glisser la vue d'un doigt */
    const PT = new Map(); let moved = 0, pinch = null;
    const at = e => { const A = app.getBoundingClientRect(); return { x: e.clientX - A.left, y: e.clientY - A.top }; };
    cv.addEventListener('wheel', e => { e.preventDefault(); const p = at(e); R.zoom(Math.exp(-e.deltaY * (e.deltaMode ? 0.05 : 0.0016)), p.x, p.y); }, { passive: false });
    cv.addEventListener('pointerdown', e => { PT.set(e.pointerId, at(e)); if (PT.size === 1) moved = 0; pinch = null; try { cv.setPointerCapture(e.pointerId); } catch (x) { /* rien */ } });
    cv.addEventListener('pointermove', e => {
      const o = PT.get(e.pointerId); if (!o) return; const p = at(e); PT.set(e.pointerId, p);
      if (PT.size === 1) { moved += Math.abs(p.x - o.x) + Math.abs(p.y - o.y); if (moved > 8) R.drag(p.x - o.x, p.y - o.y); }
      else if (PT.size === 2) { const q = [...PT.values()], d = Math.hypot(q[0].x - q[1].x, q[0].y - q[1].y), m = { x: (q[0].x + q[1].x) / 2, y: (q[0].y + q[1].y) / 2 }; if (pinch) { R.zoom(d / Math.max(1, pinch.d), m.x, m.y); R.drag(m.x - pinch.m.x, m.y - pinch.m.y); } pinch = { d, m }; moved = 99; }
    });
    const lift = e => { PT.delete(e.pointerId); pinch = null; };
    cv.addEventListener('pointercancel', lift); cv.addEventListener('lostpointercapture', lift);
    cv.addEventListener('dblclick', () => R.resetZoom());
    cv.addEventListener('pointerup', e => {
      const drag = moved > 8; lift(e); if (drag) return;   // un glissement n'est pas un toucher
      const A = app.getBoundingClientRect(), hit = GAME.tap(R.s2w(e.clientX - A.left, e.clientY - A.top), lastT);
      if (!hit || hit.fx) return closeInspect();
      if (hit.v) { if (!inspect || inspect.v !== hit.v.id) { inspect = null; showVillager(hit.v.id); } } else showBuilding(hit.b);
    });
    GAME.on = { morning: renderMorning, day: renderDay, bilan: renderBilan, end: renderEnd, save: s => { save.surv = s; persist(); } };
    showTitle(); requestAnimationFrame(loop);
  }
  boot();
  return { showTitle, startChallenge, openBook };
})();

</script>
